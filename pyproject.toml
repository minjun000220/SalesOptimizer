[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salesopt"
version = "0.1.0"
description = "아이돌 굿즈 안전 완판 가격·수량 추천 (조건부 생성모델 newsvendor의 확률 제약 변형)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "sqlalchemy>=2.0",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
cvae = ["torch>=2.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["salesopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:sqlalchemy.*"]
