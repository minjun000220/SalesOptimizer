# 매일 IdolSentiments 결과(그룹·멤버 점수)를 Supabase 에 날짜별로 저장한다.
# IdolSentiments 는 최근 90일 추이만 남기므로, 나중에 들어올 판매 기록에 '그때의 그룹 점수'를 붙이려면
# 지금부터 쌓아 두어야 한다.
# 필요한 설정: Settings → Secrets and variables → Actions → DATABASE_URL (Goods 와 같은 Session pooler 주소)
name: 아이돌 점수 저장 + 웹 데이터 갱신

on:
  schedule:
    - cron: "43 21 * * *"     # 한국 시간 06:43 (IdolSentiments 03:17 실행이 끝난 뒤)
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres]"
      - name: DB 주소 확인
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL 시크릿이 없습니다"; exit 1; fi
      - run: python -m salesopt ingest-idol
      - name: 웹용 모델·특징 올리기
        run: python -m salesopt publish

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
