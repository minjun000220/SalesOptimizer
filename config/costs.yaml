# 굿즈 종류별 비용과 검토할 가격 범위. 값이 없으면 default 를 쓴다.
#   unit_cost  개당 제작 원가 (필수)
#   salvage    못 판 재고 개당 처분가 (폐기면 0)
#   fixed_cost 1회 생산 고정비 (디자인·금형·촬영 등)
#   moq        최소 생산 수량 (안전 수량이 이보다 적으면 '만들지 않음')
#   max_qty    생산 가능 최대 수량 (선택)
#   price_min, price_max, price_step  검토할 판매가 격자
default:
  salvage: 0
  fixed_cost: 300000
  moq: 50
  price_step: 500
goods:
  키링:        {unit_cost: 4000,  price_min: 9000,  price_max: 16000}
  인형:        {unit_cost: 11000, price_min: 24000, price_max: 42000}
  아크릴스탠드: {unit_cost: 6000,  price_min: 14000, price_max: 24000}
  응원봉:      {unit_cost: 16000, price_min: 35000, price_max: 60000, moq: 300}
  티셔츠:      {unit_cost: 12000, price_min: 28000, price_max: 45000}
  포토카드:    {unit_cost: 2500,  price_min: 6000,  price_max: 11000}
